<body class="page-photo">
  <script>try{var t=localStorage.getItem('theme');if(t)document.body.classList.toggle('theme-dark',t==='dark')}catch(e){}</script>
  <header class="top">
    <a class="wordmark wordmark--icon" href="/" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v10.5h4.5v-6h4v6h4.5V9"/></svg></a>
    <button class="menu-btn" aria-expanded="false" aria-controls="menu" aria-label="Open menu">
      <span class="menu-label">Menu</span>
      <span class="menu-icon" aria-hidden="true"><i></i><i></i></span>
    </button>
  </header>

  <main>
    <!-- A pile of prints on dotted paper (same collage style as /running/). Drag them
         around, tap one to see it big, or tidy them into a grid. Photos and captions come
         from src/photography-data.js, made by scripts/prepare_photography.py. -->
    <section class="ph-intro">
      <h1 class="ph-title">Things I stopped for.</h1>
      <div class="ph-tools">
        <button class="ph-btn" data-act="shuffle" type="button">Shuffle</button>
        <button class="ph-btn ph-btn--alt" data-act="tidy" type="button">Tidy up</button>
      </div>
    </section>

    <section class="desk" aria-label="Photos"></section>

    <p class="ph-foot">More on the way.</p>
    <footer class="foot foot--page"><span>© 2026 Udit Batish</span></footer>
  </main>

  <dialog class="lb" aria-label="Photo viewer">
    <figure>
      <img alt="" />
      <figcaption><b class="lb-place"></b><span class="lb-when"></span></figcaption>
    </figure>
    <button class="lb-btn lb-prev" type="button" aria-label="Previous photo">←</button>
    <button class="lb-btn lb-next" type="button" aria-label="Next photo">→</button>
    <button class="lb-btn lb-close" type="button" aria-label="Close">×</button>
  </dialog>

  <div class="scrim"></div>
  <nav id="menu" class="menu" aria-hidden="true">

      <li><a href="/running/"><span class="n">05</span><span class="t">Running</span><span class="arr">→</span></a></li>
    </ol>
  </nav>

  <script type="module" src="/src/photography.js"></script>
